# Physics config — every threshold the gates read lives here, not in code.
#
# Loader:      src/pitch3d/core/config/physics.py
# Comparison:  scripts/physics_compare.py --profiles a,b,c
#
# Precedence (lowest → highest):
#   1. `base` defaults
#   2. `profiles.<name>.overrides`
#   3. env var overrides (PITCH3D_KIN_*, PITCH3D_COH_*)
#   4. explicit Python overrides (tests/harness only)
#
# Every constructed field carries a lineage string so we always know WHERE a
# number came from — never a hidden constant.

version: 1

# ─── base defaults ────────────────────────────────────────────────────────────
# Match kinematics.py / coherence.py field names 1:1 so the loader stays trivial.
base:

  kinematic:                # M3-9 root-XY speed/accel gate (SHIPPED)
    max_speed:             10.5      # m/s   elite sprint ceiling
    max_accel:              8.0      # m/s²  elite acceleration ceiling
    teleport_factor:        2.0      # interval speed > factor*max_speed = teleport
    spike_neighbor_frac:    0.5      # out-and-back spike test
    spike_reversal_cos:    -0.5      # neighbour cos-similarity for spike demotion
    max_passes:            50        # bounded accel-clamp sweeps
    min_correction_m:       1.0e-6   # skip emit below this positional dev
    teleport_policy:      hold       # T2b — "hold" (R-6) | "interpolate" (mark low-conf)

  coherence:                # gap-fill + edge-extend + auto-smoothing (SHIPPED)
    max_fill_gap:          12
    smooth_window:          5
    smooth_method:         moving_average
    smooth_sigma:           1.0
    smooth_root_translation: true
    smooth_root_orientation: false
    filled_confidence:      0.3
    real_confidence:        1.0
    extend_to_span:         true
    extrapolate_decay:      0.9
    extrapolated_confidence: 0.2
    extrapolate_velocity_window: 3
    coast_max_speed:       10.5      # m/s   #207 fix — coast velocity cap

  foot_floor:               # Tier 1a — NOT YET APPLIED by the pipeline
    enabled:               false
    floor_m:                0.0      # world Z under which root is clamped
    warn_hover_m:           0.30     # sanity: foot_z > this = hovering warning

  joint:                    # Tier 1b — NOT YET BUILT (schema reserved)
    enabled:               false
    max_omega_dps:        600.0      # per-joint angular velocity ceiling

  orientation:              # Tier 1c — NOT YET BUILT (schema reserved)
    enabled:               false
    max_turn_rate_dps:    720.0      # global_orient rate ceiling

  identity:                 # Roadmap step 1 — GTA-style split + cross-track merge
    enabled:               false
    dbscan_eps:             0.20     # cosine-distance eps
    dbscan_min_samples:     4        # frames to form a cluster
    min_split_gap_frames:   3        # protect against per-frame flicker
    merge_enabled:          true     # run cross-track merge after split
    merge_cosine_threshold: 0.10     # tracks with mean-feature dist below this = same identity
    merge_max_gap_frames:  60        # cap on how far apart merge candidates can sit
    dry_run:                false

  foot_plant:               # T6.a — recenter root Z so subjects don't hover
    enabled:               false
    mode:                  median_lock   # "off" | "median_lock" | "hard_lock"
    target_pelvis_m:       0.92          # nominal pelvis-above-floor for standing player
    bias_threshold_m:      0.05          # skip subjects already within this of target
    min_correction_m:      1.0e-4

  collision:                # Tier 3 — capsule soft-repulsion post-process
    enabled:               false
    capsule_radius_m:       0.35     # ~ shoulder half-width for a standing player
    strength:               0.5      # fraction of overlap resolved per pass
    n_passes:               4        # bounded Jacobi iterations per frame
    max_push_per_frame_m:   0.30     # safety cap on the per-frame net push
    min_correction_m:       1.0e-4   # skip emit below this net positional dev

  contact_probe:            # step 3 — detect + measure foot slide during contact
    enabled:               false
    contact_z_threshold_m: 0.05
    min_contact_run_frames: 2
    slide_threshold_m:     0.05

  momentum_smooth:          # step 4b — low-pass root translation to kill CoM jerk
    enabled:               false
    smooth_window:          5
    preserve_contact:      true
    contact_z_threshold_m: 0.05
    min_contact_run_frames: 2
    min_correction_m:      1.0e-3

  pose_motion_sync:         # procedural walk cycle on desynced frames
    enabled:               false
    velocity_threshold_mps: 1.0
    joint_activity_threshold: 0.10
    knee_amplitude_rad:    0.35
    hip_amplitude_rad:     0.20
    full_speed_mps:        6.0
    strides_per_metre:     0.7

  facing_align:             # yaw ↔ motion-direction lock
    enabled:               false
    velocity_threshold_mps: 1.0
    yaw_tolerance_rad:     0.79
    yaw_ewma_window:       5

  inertia_smooth:           # low-pass yaw to bound α
    enabled:               false
    smooth_window:          3
    max_alpha_rad_s2:     15.0
    min_correction_rad:    1.0e-3

  gravity_project:          # airborne Z → ballistic parabola
    enabled:               false
    airborne_z_threshold_m: 0.10
    min_airborne_run_frames: 3
    min_correction_m:      1.0e-3

  jerk_clamp:               # iterative low-pass on transl until peak jerk under ceiling
    enabled:               false
    max_jerk_mps3:       200.0
    smooth_window:          5
    max_passes:            10
    min_correction_m:      1.0e-3

  ball:                     # measurement thresholds for scripts/motion_stats.py etc.
    max_speed:             36.0      # m/s   hardest recorded shot
    max_accel:            200.0      # m/s²  a kick — very high but bounded

  probe:                    # scripts/motion_stats.py thresholds — parametric, not hard-coded
    turn_min_speed:         2.0      # m/s   turn rate only meaningful above this speed
    joint_min_omega_dps:  600.0      # per-joint angular-velocity flag threshold
    orient_min_dps:       720.0      # root-orientation turn-rate flag threshold
    foot_hover_m:           0.30     # foot_z above this = hovering warning

# ─── named profiles for A/B comparison ────────────────────────────────────────
# Each profile lists a partial override tree on top of `base`. Comparison harness
# runs the same scene through each profile and reports the diff.

profiles:

  default:
    description: "Ships-today defaults (M3-9 as merged, no future gates)."
    overrides: {}

  conservative:
    description: "Non-elite match tuning: 9 m/s ceiling, 6 m/s² accel, wider smoothing."
    overrides:
      kinematic:
        max_speed:          9.0
        max_accel:          6.0
      coherence:
        smooth_window:      7

  strict:
    description: "Tightest limits — comparison anchor. Will over-clamp real motion."
    overrides:
      kinematic:
        max_speed:          8.0
        max_accel:          5.0
        teleport_factor:    1.5

  no_smoothing:
    description: "Gate only, no coherence root-translation smoothing (isolate the gate effect)."
    overrides:
      coherence:
        smooth_root_translation: false

  future_full:
    description: "Preview: all future gates on (foot floor + joint + orientation + collision) at safe defaults."
    overrides:
      foot_floor:
        enabled:            true
      joint:
        enabled:            true
      orientation:
        enabled:            true
      collision:
        enabled:            true

  safe_new:
    description: "Recommended for pod runs: T1a+T1b+T1c on, collision OFF (known accel-spike tradeoff)."
    overrides:
      foot_floor:
        enabled:            true
      joint:
        enabled:            true
      orientation:
        enabled:            true

  safe_new_plant:
    description: "safe_new + T6.a foot_plant (median-lock Z bias fix — 'stop hovering')."
    overrides:
      foot_floor:
        enabled:            true
      joint:
        enabled:            true
      orientation:
        enabled:            true
      foot_plant:
        enabled:            true

  safe_new_plant_lock:
    description: "safe_new_plant + step 3b contact_lock + step 4b momentum_smooth. Kills glide."
    overrides:
      foot_floor:
        enabled:            true
      joint:
        enabled:            true
      orientation:
        enabled:            true
      foot_plant:
        enabled:            true
      contact_probe:
        enabled:            true
      momentum_smooth:
        enabled:            true
        preserve_contact:  false
        smooth_window:      7

  full_realism:
    description: "All physics gates on: hover+glide+desync+moonwalk+twitch corrections all active."
    overrides:
      foot_floor:
        enabled:            true
      joint:
        enabled:            true
      orientation:
        enabled:            true
      foot_plant:
        enabled:            true
      contact_probe:
        enabled:            true
      momentum_smooth:
        enabled:            true
        preserve_contact:  false
        smooth_window:      7
      pose_motion_sync:
        enabled:            true
      facing_align:
        enabled:            true
      inertia_smooth:
        enabled:            true
      gravity_project:
        enabled:            true
      jerk_clamp:
        enabled:            true

  full_realism_collide:
    description: "full_realism + capsule collision; momentum_smooth cleans up the push spikes."
    overrides:
      foot_floor:
        enabled:            true
      joint:
        enabled:            true
      orientation:
        enabled:            true
      foot_plant:
        enabled:            true
      collision:
        enabled:            true
        strength:           0.3
        max_push_per_frame_m: 0.15
      contact_probe:
        enabled:            true
      momentum_smooth:
        enabled:            true
        preserve_contact:  false
        smooth_window:      7
      pose_motion_sync:
        enabled:            true
      facing_align:
        enabled:            true
      inertia_smooth:
        enabled:            true

  safe_new_humanize:
    description: "safe_new + humanize_teleports — closes hover/joint/orient AND smooths ID-swap jumps."
    overrides:
      foot_floor:
        enabled:            true
      joint:
        enabled:            true
      orientation:
        enabled:            true
      kinematic:
        teleport_policy:    interpolate

  humanize_teleports:
    description: "Interpolate teleport regions instead of preserving the jump — marked R-6 low-conf."
    overrides:
      kinematic:
        teleport_policy:    interpolate
