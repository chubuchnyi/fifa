<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>poseannot — pitch view</title>
  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root { color-scheme: dark; --film-w: 34vw; }
    html, body { margin:0; height:100%; background:#14161a; color:#d7dae0;
                 font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
    /* Frame on the left, pitch on the right, one scrubber under both. The eye review is a
       frame-by-frame comparison against the video, and alt-tabbing between two windows to make it
       is how a mismatch gets attributed to the wrong frame. */
    #split { position:absolute; inset:0 0 46px 0; display:flex; }
    #film { width:var(--film-w); min-width:0; background:#0d0f12; position:relative;
            display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #film img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
    #film.off { display:none; }
    #film .cap { position:absolute; top:8px; left:10px; font-size:11px; color:#8b929e;
                 text-shadow:0 1px 2px #000; pointer-events:none; }
    #gutter { width:6px; cursor:col-resize; background:#2b2f36; flex:0 0 6px; }
    #gutter:hover, #gutter.drag { background:#4a90d9; }
    #film.off + #gutter { display:none; }
    #view { flex:1; min-width:0; position:relative; }
    #bar { position:absolute; left:0; right:0; bottom:0; height:46px; display:flex;
           align-items:center; gap:10px; padding:0 12px; background:#1b1e23;
           border-top:1px solid #2b2f36; box-sizing:border-box; }
    #bar button { background:#262a31; color:#d7dae0; border:1px solid #363b44;
                  border-radius:4px; padding:4px 10px; cursor:pointer; font:inherit; }
    #bar button:hover { background:#2f343c; }
    #scrub { flex:1; min-width:120px; }
    .num { font-variant-numeric:tabular-nums; }
    .muted { color:#8b929e; }
    #hud { position:absolute; top:10px; left:12px; pointer-events:none;
           text-shadow:0 1px 2px #000; }
    #err { position:absolute; top:10px; right:12px; color:#ff8f8f; max-width:46%; }
    a { color:#7fb2ff; }
  </style>
</head>
<body>
<div id="split">
  <div id="film" class="off"><img id="frameimg" alt="frame" /><span class="cap">source frame</span></div>
  <div id="gutter"></div>
  <div id="view">
    <div id="hud">
      <div><b>pitch view</b> <span class="muted">— drag: orbit · right/middle-drag or WASD: pan ·
        wheel: zoom · double-click a player: orbit around him · F: frame all</span></div>
      <div class="muted"><span id="stat">loading…</span></div>
      <div style="color:#ff3ea5"><span id="stat2"></span></div>
    </div>
    <div id="err"></div>
  </div>
</div>
<div id="bar">
  <a href="/app" title="back to the annotation UI">← app</a>
  <button id="prev" title="previous frame (←)">◀</button>
  <button id="play" title="play / pause (space)">▶</button>
  <button id="next" title="next frame (→)">▶|</button>
  <input id="scrub" type="range" min="0" max="0" value="0" />
  <span class="num" id="fnum">0</span>
  <span class="muted">|</span>
  <label title="show the source video frame beside the 3D, same frame number"><input type="checkbox" id="film-on" /> frame</label>
  <label><input type="checkbox" id="ids" /> ids</label>
  <label><input type="checkbox" id="trails" /> trails</label>
  <label title="dim bodies whose pose was filled in rather than measured (R-6)"><input type="checkbox" id="prov" checked /> mark imputed</label>
  <label title="lay a second reconstruction (POSEANNOT_SCENE_JSON_B) over this one in magenta"><input type="checkbox" id="overlay" /> overlay B</label>
  <button id="reset" title="reset the camera">reset view</button>
</div>

<script type="module">
// Standalone host for the pitch view. The scene, camera and drawing live in world_view.js so that
// index.html's right panel can mount the same component instead of carrying a second copy; this
// page owns only the chrome — scrubber, toggles, and the source-frame panel.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
// Absolute, not "./": this page is served from the route /world, so a relative specifier would
// resolve to /world_view.js and 404. The ?v= token is the same cache-bust discipline style.css
// needs — bump it on every edit to world_view.js or the browser verifies the old module.
import { createWorldView } from "/static/world_view.js?v=3";

const $ = (id) => document.getElementById(id);
const err = (m) => { $("err").textContent = m || ""; };

const view = createWorldView({
  mount: $("view"), THREE, OrbitControls,
  onStatus: (m) => { $("stat").textContent = m; },
  onStatus2: (m) => { $("stat2").textContent = m; },
  onError: err,
});

let nFrames = 0, frame = 0, playing = false;

function paintFilm() {
  if (!$("film-on").checked) return;
  $("frameimg").src = `/api/frame/${frame}`;
}

async function show(n) {
  frame = Math.max(0, Math.min(nFrames - 1, n));
  $("scrub").value = String(frame);
  $("fnum").textContent = String(frame);
  paintFilm();
  await view.show(frame);
}

function syncOpts() {
  view.setOpts({
    ids: $("ids").checked, trails: $("trails").checked,
    prov: $("prov").checked, overlayB: $("overlay").checked,
  });
}

$("prev").onclick = () => { playing = false; show(frame - 1); };
$("next").onclick = () => { playing = false; show(frame + 1); };
$("reset").onclick = () => view.resetView();
$("play").onclick = (e) => {
  playing = !playing;
  e.target.textContent = playing ? "❚❚" : "▶";
};
$("scrub").oninput = () => { playing = false; show(Number($("scrub").value)); };
for (const id of ["ids", "trails", "prov", "overlay"]) {
  $(id).onchange = () => { syncOpts(); show(frame); };
}
$("film-on").onchange = () => {
  $("film").classList.toggle("off", !$("film-on").checked);
  view.resize();
  paintFilm();
};

// Drag the gutter to trade width between the frame and the pitch. Pointer capture, so the drag
// survives the cursor crossing the WebGL canvas — which swallows plain mousemove.
$("gutter").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  $("gutter").setPointerCapture(e.pointerId);
  $("gutter").classList.add("drag");
  const move = (ev) => {
    const w = Math.max(120, Math.min(innerWidth - 200, ev.clientX));
    document.documentElement.style.setProperty("--film-w", w + "px");
    view.resize();
  };
  const up = () => {
    $("gutter").classList.remove("drag");
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
  };
  addEventListener("pointermove", move);
  addEventListener("pointerup", up);
});

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") { playing = false; show(frame - 1); }
  else if (e.key === "ArrowRight") { playing = false; show(frame + 1); }
  else if (e.key === " ") { e.preventDefault(); $("play").click(); }
});

// Playback lives here, not in the component: the app drives frames from Alpine and would fight a
// second clock. `busy` gates it so a slow frame throttles playback instead of queueing.
let last = 0;
(function loop(t) {
  requestAnimationFrame(loop);
  if (playing && t - last > 80 && !view.busy) {     // ~12 fps: fast enough to read motion
    last = t;
    show(frame + 1 >= nFrames ? 0 : frame + 1);
  }
})(0);

(async function main() {
  try {
    syncOpts();
    nFrames = await view.init();
    $("scrub").max = String(Math.max(0, nFrames - 1));
    await show(0);
  } catch (e) {
    err("failed to load: " + (e.message || e));
    $("stat").textContent = "";
  }
})();
</script>
</body>
</html>
