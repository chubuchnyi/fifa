<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>poseannot</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three":               "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/":       "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "alpinejs":            "https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/module.esm.js"
    }
  }
  </script>
</head>
<body>
<div class="app-shell" x-data="poseAnnot()" x-init="init()">

  <!-- Toolbar -->
  <div class="toolbar">
    <span class="brand">poseannot</span>
    <span class="sep">|</span>
    <select class="clip-select" x-model="activeClipId" @change="switchClip($event.target.value)">
      <template x-for="c in clipList" :key="c.id">
        <option :value="c.id" x-text="c.label + (c.builtin ? '  (default)' : '')"></option>
      </template>
    </select>
    <button @click="showUpload = !showUpload" title="upload a clip bundle (video + scene.json)">＋</button>
    <span style="color: var(--fg-dim); font-size: 0.8em;" x-text="clipLabel"></span>
    <span class="sep">|</span>
    <button @click="prevFrame()" title="prev frame (K)">◀</button>
    <span x-text="'frame ' + (frame+1) + ' / ' + nFrames"></span>
    <input class="frame-input" type="number" x-model.number="frameInput"
           min="1" :max="nFrames" @change="jumpToFrame(frameInput - 1)" />
    <button @click="nextFrame()" title="next frame (J)">▶</button>
    <span class="sep">|</span>
    <span x-text="selectedTrackId !== null ? ('subj t' + selectedTrackId) : 'no subject'"></span>
    <template x-if="selectedJoint !== null">
      <span style="color: var(--edited); font-weight: 500;">
        · joint <span x-text="jointNames[selectedJoint]"></span> (<span x-text="selectedJoint"></span>)
      </span>
    </template>
    <button @click="undoEdit()" x-show="selectedJoint !== null"
            title="undo edit (Ctrl+Z)">undo</button>
    <button @click="deselectJoint()" x-show="selectedJoint !== null">deselect</button>
    <span class="user">
      <span x-text="user"></span> · <a href="/logout">logout</a>
    </span>
  </div>

  <!-- Upload clip bundle -->
  <div class="upload-panel" x-show="showUpload" x-cloak @click.outside="showUpload = false">
    <div class="uh">upload clip bundle</div>
    <label>name
      <input type="text" x-model="upl.name" placeholder="my-clip" />
    </label>
    <label>video
      <input type="file" accept="video/*" @change="upl.video = $event.target.files[0]" />
    </label>
    <label>scene.json
      <input type="file" accept="application/json,.json" @change="upl.scene = $event.target.files[0]" />
    </label>
    <label>edits.json (optional)
      <input type="file" accept="application/json,.json" @change="upl.edits = $event.target.files[0]" />
    </label>
    <div class="upl-row">
      <span class="upl-msg" x-text="upl.msg"></span>
      <button @click="doUpload()" :disabled="upl.busy">upload</button>
    </div>
    <div class="upl-hint">A bundle = video + its <b>scene.json</b> (pipeline output:
      poses, tracks, camera). A bare video has nothing to annotate.</div>
  </div>

  <!-- Sidebar: tracks -->
  <div class="sidebar">
    <div class="section-hdr">tracks · <span x-text="tracks.length"></span></div>
    <template x-for="t in tracks" :key="t.track_id">
      <div class="track"
           :class="{ selected: t.track_id === selectedTrackId }"
           @click="selectTrack(t.track_id)">
        <div class="swatch" :style="'background:' + trackColor(t.track_id)"></div>
        <span x-text="'t' + t.track_id"></span>
        <span style="margin-left:auto; color: var(--fg-dim); font-size: 0.8em;"
              x-text="t.n_frames + 'f'"></span>
      </div>
    </template>
  </div>

  <!-- Main: video + 2D overlay (all players; active highlighted) -->
  <div class="main" :class="{ panning: _panning }"
       @wheel.prevent="onWheel($event)"
       @pointerdown="onPanStart($event)"
       @pointermove="onPanMove($event)"
       @pointerup="onPanEnd($event)"
       @pointerleave="onPanEnd($event)">
    <div class="canvas-frame" x-ref="canvasFrame">
      <div class="zoom-layer" :style="zoomStyle()">
        <img :src="frameSrc" @load="onFrameLoaded($event)" @dragstart.prevent
             x-ref="frameImg" x-show="frameSrc" alt="frame" />
        <!-- overlay injected as an SVG string via x-html: setting innerHTML on
             an <svg> parses children in the SVG namespace, unlike <template
             x-for> which clones them as inert HTML elements (never renders). -->
        <svg :viewBox="'0 0 ' + srcW + ' ' + srcH"
             x-show="overlaySvgStr"
             x-html="overlaySvgStr"
             preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
    <div class="zoom-hud">
      <button @click="zoomBy(1/1.25)" title="zoom out">−</button>
      <span x-text="Math.round(view.scale * 100) + '%'"></span>
      <button @click="zoomBy(1.25)" title="zoom in">+</button>
      <button @click="resetView()" title="fit (0)" style="min-width:34px;">fit</button>
    </div>
  </div>

  <!-- Right: 3D pose view (Three.js) -->
  <div class="right">
    <div class="hdr">
      3D pose
      <span x-show="selectedTrackId !== null" style="color: var(--fg-dim)">
        · t<span x-text="selectedTrackId"></span> · frame <span x-text="frame+1"></span>
      </span>
      <span class="spacer"></span>
      <button @click="undoEdit()" :disabled="selectedTrackId === null"
              title="undo last edit on this subject/frame (Ctrl+Z)">undo</button>
      <button @click="exportEdits()" title="download all edits as edits.json">export</button>
      <button @click="toggleShowAll()" :class="{ active: showAll }"
              :title="showAll ? 'showing all players (A)' : 'showing active only (A)'"
              x-text="showAll ? 'show: all' : 'show: active'"></button>
    </div>
    <div id="three-canvas"></div>
  </div>

  <!-- Timeline -->
  <div class="timeline">
    <template x-for="f in nFrames" :key="f">
      <div class="cell"
           :class="{
             auto: !isFrameEdited(f-1),
             edited: isFrameEdited(f-1),
             current: f-1 === frame,
           }"
           @click="jumpToFrame(f-1)"></div>
    </template>
  </div>

</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import Alpine from "alpinejs";

// bone connectivity — SMPL-X body (pelvis + 21 joints)
const BONES = [
  [0, 1], [0, 2], [0, 3],           // pelvis → hips, spine1
  [1, 4], [4, 7], [7, 10],          // left leg
  [2, 5], [5, 8], [8, 11],          // right leg
  [3, 6], [6, 9], [9, 12], [12, 15], // spine → neck → head
  [9, 13], [13, 16], [16, 18], [18, 20],   // left arm
  [9, 14], [14, 17], [17, 19], [19, 21],   // right arm
];

// scene_state.BODY_JOINT_NAMES[i] with i=0 pelvis. body_pose[j] controls
// joint (j+1) — i.e. body_pose[3] = left_knee.  Server accepts joint_index
// 0..20 in body_pose space.
function jointToBodyPoseIndex(jointIdx) {
  // joint 0 = pelvis (global_orient, not body_pose) — skip; joints 1..21 → 0..20
  return jointIdx - 1;
}
function bodyPoseIndexToJoint(bpIdx) { return bpIdx + 1; }

function trackColorFor(tid) {
  // deterministic hue from tid
  const hue = (tid * 137) % 360;
  return `hsl(${hue}, 70%, 60%)`;
}

let threeState = null;
function initThree(alpineState) {
  const container = document.getElementById("three-canvas");
  const w = container.clientWidth, h = container.clientHeight;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#1c1e22");
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.05, 100);
  // near eye-level (low z) so the figure reads as a standing person, not a
  // top-down blob; joints are pelvis-centred so body spans z≈[-0.9,+0.7].
  camera.position.set(2.6, 1.9, 0.5);
  camera.up.set(0, 0, 1);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const orbit = new OrbitControls(camera, renderer.domElement);
  orbit.target.set(0, 0, -0.05);
  orbit.update();

  // lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(3, 3, 5);
  scene.add(key);

  const grid = new THREE.GridHelper(4, 8, 0x555555, 0x333333);
  grid.rotation.x = Math.PI / 2;
  scene.add(grid);

  const poseGroup = new THREE.Group();
  scene.add(poseGroup);

  // Transform gizmo — invisible until a joint is picked
  const gizmoAnchor = new THREE.Object3D();
  scene.add(gizmoAnchor);
  const transform = new TransformControls(camera, renderer.domElement);
  transform.setMode("rotate");
  transform.setSpace("world");
  transform.setSize(0.6);
  transform.attach(gizmoAnchor);
  transform.visible = false;
  transform.enabled = false;
  scene.add(transform.getHelper ? transform.getHelper() : transform);
  // free orbit while dragging gizmo
  transform.addEventListener("dragging-changed", (ev) => {
    orbit.enabled = !ev.value;
    if (!ev.value && alpineState._pendingAxisAngle) {
      alpineState.commitGizmoEdit();
    }
  });
  transform.addEventListener("objectChange", () => {
    alpineState.onGizmoRotate(gizmoAnchor.quaternion);
  });

  // raycaster for joint picking
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const jointSpheres = []; // filled when pose is rebuilt

  renderer.domElement.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    if (transform.dragging) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(jointSpheres, false);
    if (hits.length) {
      alpineState.selectJoint(hits[0].object.userData.jointIdx);
    }
  });

  function tick() {
    requestAnimationFrame(tick);
    orbit.update();
    renderer.render(scene, camera);
  }
  tick();

  window.addEventListener("resize", () => {
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  threeState = {
    scene, camera, orbit, renderer, poseGroup,
    transform, gizmoAnchor, jointSpheres,
  };
  return threeState;
}

function updateThreePose(joints, meshVerts, meshFaces, selectedJoint, others = []) {
  if (!threeState) return;
  const g = threeState.poseGroup;
  while (g.children.length) g.remove(g.children[0]);
  threeState.jointSpheres.length = 0;

  const pelvis = joints[0];

  if (meshVerts && meshFaces) {
    const geo = new THREE.BufferGeometry();
    const flat = new Float32Array(meshVerts.length * 3);
    for (let i = 0; i < meshVerts.length; i++) {
      flat[i*3]   = meshVerts[i][0] - pelvis[0];
      flat[i*3+1] = meshVerts[i][1] - pelvis[1];
      flat[i*3+2] = meshVerts[i][2] - pelvis[2];
    }
    geo.setAttribute("position", new THREE.BufferAttribute(flat, 3));
    const idx = new Uint32Array(meshFaces.length * 3);
    for (let i = 0; i < meshFaces.length; i++) {
      idx[i*3]   = meshFaces[i][0];
      idx[i*3+1] = meshFaces[i][1];
      idx[i*3+2] = meshFaces[i][2];
    }
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: 0x6bb5ff, roughness: 0.6, metalness: 0.0,
      transparent: true, opacity: 0.4, side: THREE.DoubleSide,
      depthWrite: false,
    });
    g.add(new THREE.Mesh(geo, mat));
  }

  const normalMat = new THREE.MeshBasicMaterial({ color: 0xffb14f });
  const selMat    = new THREE.MeshBasicMaterial({ color: 0xff5b5b });
  const jointGeo  = new THREE.SphereGeometry(0.028, 14, 14);
  for (let i = 0; i < joints.length; i++) {
    const mat = (i === selectedJoint) ? selMat : normalMat;
    const m = new THREE.Mesh(jointGeo, mat);
    m.position.set(
      joints[i][0] - pelvis[0],
      joints[i][1] - pelvis[1],
      joints[i][2] - pelvis[2],
    );
    m.userData.jointIdx = i;
    g.add(m);
    threeState.jointSpheres.push(m);
  }

  const boneMat = new THREE.LineBasicMaterial({ color: 0xa8d4ff });
  for (const [a, b] of BONES) {
    const pa = joints[a], pb = joints[b];
    if (!pa || !pb) continue;
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(pa[0] - pelvis[0], pa[1] - pelvis[1], pa[2] - pelvis[2]),
      new THREE.Vector3(pb[0] - pelvis[0], pb[1] - pelvis[1], pb[2] - pelvis[2]),
    ]);
    g.add(new THREE.Line(geo, boneMat));
  }

  // Other subjects (show-all): colored stick figures, not pickable, placed
  // relative to the active subject's pelvis so world offsets are preserved.
  for (const o of others) {
    const col = new THREE.Color(trackColorFor(o.track_id));
    const oJointMat = new THREE.MeshBasicMaterial({ color: col });
    const oBoneMat = new THREE.LineBasicMaterial({ color: col });
    const oGeo = new THREE.SphereGeometry(0.022, 10, 10);
    for (let i = 0; i < o.joints.length; i++) {
      const m = new THREE.Mesh(oGeo, oJointMat);
      m.position.set(
        o.joints[i][0] - pelvis[0],
        o.joints[i][1] - pelvis[1],
        o.joints[i][2] - pelvis[2],
      );
      g.add(m);
    }
    for (const [a, b] of BONES) {
      const pa = o.joints[a], pb = o.joints[b];
      if (!pa || !pb) continue;
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(pa[0] - pelvis[0], pa[1] - pelvis[1], pa[2] - pelvis[2]),
        new THREE.Vector3(pb[0] - pelvis[0], pb[1] - pelvis[1], pb[2] - pelvis[2]),
      ]);
      g.add(new THREE.Line(geo, oBoneMat));
    }
  }

  // Position gizmo at selected joint, or hide it
  if (selectedJoint !== null && selectedJoint !== undefined
      && selectedJoint > 0 && joints[selectedJoint]) {
    const j = joints[selectedJoint];
    threeState.gizmoAnchor.position.set(
      j[0] - pelvis[0], j[1] - pelvis[1], j[2] - pelvis[2],
    );
    threeState.gizmoAnchor.quaternion.identity();
    threeState.transform.visible = true;
    threeState.transform.enabled = true;
  } else {
    threeState.transform.visible = false;
    threeState.transform.enabled = false;
  }

  threeState.orbit.target.set(0, 0, -0.05);
}

Alpine.data("poseAnnot", () => ({
    user: "user",
    clipLabel: "loading…",
    clipList: [],
    activeClipId: "default",
    showUpload: false,
    upl: { name: "", video: null, scene: null, edits: null, busy: false, msg: "" },
    nFrames: 0,
    tracks: [],
    jointNames: [],
    selectedTrackId: null,
    selectedJoint: null,      // joint index 0..21 (0 = pelvis, non-editable)
    _pendingAxisAngle: null,  // set on gizmo drag, cleared on commit
    _liveJoints: null,        // last-received joints for current (subj, frame)
    _liveMesh: null,
    _liveOthers: [],          // other subjects' 3D joints (show-all)
    editedFrames: {},         // { "15": [30, 32, ...], ... }
    frame: 0,
    frameInput: 1,
    frameSrc: "",
    imgSize: { w: 0, h: 0 },
    srcW: 1920, srcH: 1080,
    allSkeletons: [],         // [{track_id, pts:[[x,y]|null,...]}, ...]
    overlaySvgStr: "",        // rendered SVG markup (x-html into the <svg>)
    showAll: false,           // 3D: show all players vs active only
    bones: BONES,
    accentBright: "#a8d4ff",
    editedColor: "#ffb14f",
    view: { scale: 1, tx: 0, ty: 0 },
    _viewInit: false,
    _panning: false,
    _panLast: null,

    trackColor(tid) { return trackColorFor(tid); },
    zoomStyle() {
      return `width:${this.imgSize.w}px;height:${this.imgSize.h}px;`
           + `transform:translate(${this.view.tx}px,${this.view.ty}px) scale(${this.view.scale});`
           + `transform-origin:0 0;`;
    },

    async init() {
      initThree(this);
      window.addEventListener("resize", () => { this.fitLayer(); this.resetView(); });
      const r = await fetch("/api/scene");
      if (r.status === 401) { window.location = "/"; return; }
      const j = await r.json();
      this.nFrames = j.n_frames;
      this.tracks = j.tracks;
      this.jointNames = j.joint_names;
      if (j.clip) {
        this.clipLabel = `${j.clip.video_name}  ·  ${j.n_subjects} subjects  ·  ${j.n_frames} frames @ ${j.clip.fps.toFixed(2)}fps`;
      }
      if (this.tracks.length) this.selectedTrackId = this.tracks[0].track_id;
      await this.refreshClips();
      await this.refreshEditedFrames();
      await this.loadFrame(0);
      this.attachKeyboard();
    },

    async refreshClips() {
      const r = await fetch("/api/clips");
      if (!r.ok) return;
      const d = await r.json();
      this.clipList = d.clips || [];
      this.activeClipId = d.active || "default";
    },

    async switchClip(id) {
      if (!id || id === this.activeClipId) return;
      const r = await fetch("/api/clips/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clip_id: id }),
      });
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        this.upl.msg = "switch failed: " + (e.detail || r.status);
        await this.refreshClips();   // re-sync <select> to the still-active clip
        return;
      }
      window.location.reload();   // simplest: re-init everything for the new clip
    },

    async doUpload() {
      if (!this.upl.video || !this.upl.scene) {
        this.upl.msg = "need video + scene.json";
        return;
      }
      this.upl.busy = true;
      this.upl.msg = "uploading…";
      const fd = new FormData();
      fd.append("clip_id", this.upl.name || "clip");
      fd.append("video", this.upl.video);
      fd.append("scene", this.upl.scene);
      if (this.upl.edits) fd.append("edits", this.upl.edits);
      const r = await fetch("/api/clips/upload", { method: "POST", body: fd });
      this.upl.busy = false;
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        this.upl.msg = "failed: " + (e.detail || r.status);
        return;
      }
      const d = await r.json();
      this.upl.msg = "uploaded ✓ — switching…";
      await this.refreshClips();
      this.showUpload = false;
      await this.switchClip(d.clip.id);
    },

    attachKeyboard() {
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); this.undoEdit(); return; }
        if (e.key === "Escape") { this.deselectJoint(); return; }
        if (e.key === "0") { this.resetView(); return; }
        if (e.key === "a" || e.key === "A") { this.toggleShowAll(); return; }
        if (e.key === "j" || e.key === "ArrowRight") this.nextFrame();
        else if (e.key === "k" || e.key === "ArrowLeft") this.prevFrame();
      });
    },

    async loadFrame(n) {
      this.frame = n;
      this.frameInput = n + 1;
      this.frameSrc = `/api/frame/${n}?ts=${Date.now()}`;
      this.selectedJoint = null;
      await this.refreshSkeletons();
      await this.refreshThree();
    },

    onFrameLoaded(e) {
      const img = e.target;
      this.srcW = img.naturalWidth;
      this.srcH = img.naturalHeight;
      this.fitLayer();
    },

    async refreshSkeletons() {
      const r = await fetch(`/api/frame/${this.frame}/skeletons`);
      if (!r.ok) { this.allSkeletons = []; this.rebuildOverlay(); return; }
      const d = await r.json();
      this.allSkeletons = d.subjects || [];
      this.rebuildOverlay();
    },

    rebuildOverlay() {
      // Build one SVG markup string. Active subject painted last (on top) and
      // wrapped in a dashed bbox marker so the edited player is unmistakable.
      const sks = [...this.allSkeletons].sort((p, q) =>
        (p.track_id === this.selectedTrackId ? 1 : 0) - (q.track_id === this.selectedTrackId ? 1 : 0));
      const out = [];
      for (const sk of sks) {
        const active = sk.track_id === this.selectedTrackId;
        const col = active ? this.accentBright : trackColorFor(sk.track_id);
        const jc = active ? this.editedColor : trackColorFor(sk.track_id);
        for (const [a, b] of this.bones) {
          const pa = sk.pts[a], pb = sk.pts[b];
          if (!pa || !pb) continue;
          out.push(`<line x1="${pa[0]}" y1="${pa[1]}" x2="${pb[0]}" y2="${pb[1]}"`
            + ` stroke="${col}" stroke-width="${active ? 5 : 3}" opacity="${active ? 0.95 : 0.45}"/>`);
        }
        for (const pt of sk.pts) {
          if (!pt) continue;
          out.push(`<circle cx="${pt[0]}" cy="${pt[1]}" r="${active ? 5 : 3.5}"`
            + ` fill="${jc}" opacity="${active ? 1 : 0.55}" stroke="#000" stroke-width="0.7"/>`);
        }
        const xs = [], ys = [];
        for (const pt of sk.pts) { if (pt) { xs.push(pt[0]); ys.push(pt[1]); } }
        if (!xs.length) continue;
        if (active) {
          const pad = 16;
          const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
          const bw = Math.max(...xs) - Math.min(...xs) + 2 * pad;
          const bh = Math.max(...ys) - Math.min(...ys) + 2 * pad;
          out.push(`<rect x="${x0}" y="${y0}" width="${bw}" height="${bh}" fill="none"`
            + ` stroke="${this.accentBright}" stroke-width="2.5" stroke-dasharray="12 7" opacity="0.9"/>`);
          out.push(`<text x="${x0}" y="${y0 - 8}" font-size="30" fill="${this.accentBright}"`
            + ` font-weight="700" paint-order="stroke" stroke="#000" stroke-width="3">`
            + `t${sk.track_id} ● active</text>`);
        } else {
          out.push(`<text x="${sk.pts[0] ? sk.pts[0][0] + 8 : xs[0]}" y="${sk.pts[0] ? sk.pts[0][1] - 10 : ys[0]}"`
            + ` font-size="24" fill="${col}" opacity="0.65" paint-order="stroke"`
            + ` stroke="#000" stroke-width="3">t${sk.track_id}</text>`);
        }
      }
      this.overlaySvgStr = out.join("");
    },

    async refreshThree() {
      if (this.selectedTrackId === null) return;
      const [jr, mr] = await Promise.all([
        fetch(`/api/subject/${this.selectedTrackId}/joints/${this.frame}`),
        fetch(`/api/subject/${this.selectedTrackId}/mesh/${this.frame}`),
      ]);
      if (!jr.ok || !mr.ok) return;
      const jj = await jr.json();
      const mm = await mr.json();
      this._liveJoints = jj.joints;
      this._liveMesh = { verts: mm.verts, faces: mm.faces };
      let others = [];
      if (this.showAll) {
        const pr = await fetch(`/api/frame/${this.frame}/poses3d`);
        if (pr.ok) {
          const pj = await pr.json();
          others = (pj.subjects || []).filter((s) => s.track_id !== this.selectedTrackId);
        }
      }
      this._liveOthers = others;
      updateThreePose(jj.joints, mm.verts, mm.faces, this.selectedJoint, others);
    },

    async selectTrack(tid) {
      this.selectedTrackId = tid;
      this.selectedJoint = null;
      this.rebuildOverlay();
      await this.refreshThree();
    },

    selectJoint(jointIdx) {
      // joint 0 is the pelvis (global_orient, not body_pose) — read-only for v1.
      if (jointIdx === 0) return;
      this.selectedJoint = jointIdx;
      // re-render Three.js with the selection highlighted + gizmo attached
      if (this._liveJoints && this._liveMesh) {
        updateThreePose(this._liveJoints, this._liveMesh.verts, this._liveMesh.faces, jointIdx, this._liveOthers);
      }
    },

    deselectJoint() {
      this.selectedJoint = null;
      this._pendingAxisAngle = null;
      if (this._liveJoints && this._liveMesh) {
        updateThreePose(this._liveJoints, this._liveMesh.verts, this._liveMesh.faces, null, this._liveOthers);
      }
    },

    // Called by TransformControls on each rotation step. Live-record the
    // gizmo's current quaternion as the intended new axis-angle for the
    // selected joint's body_pose delta.
    onGizmoRotate(quat) {
      // convert to axis-angle
      const q = quat.clone().normalize();
      const angle = 2 * Math.acos(Math.min(1, Math.max(-1, q.w)));
      const s = Math.sqrt(1 - q.w * q.w);
      let ax, ay, az;
      if (s < 1e-6) { ax = 1; ay = 0; az = 0; }
      else { ax = q.x / s; ay = q.y / s; az = q.z / s; }
      this._pendingAxisAngle = [ax * angle, ay * angle, az * angle];
    },

    async commitGizmoEdit() {
      const aa = this._pendingAxisAngle;
      this._pendingAxisAngle = null;
      if (!aa || this.selectedJoint === null || this.selectedJoint === 0) return;
      const bpIdx = jointToBodyPoseIndex(this.selectedJoint);
      const body = {
        track_id: this.selectedTrackId,
        frame: this.frame,
        joint_index: bpIdx,
        axis_angle: aa,
      };
      const r = await fetch("/api/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) { console.warn("edit failed", r.status); return; }
      const d = await r.json();
      this._liveJoints = d.joints;
      this._liveMesh = { verts: d.verts, faces: d.faces };
      updateThreePose(d.joints, d.verts, d.faces, this.selectedJoint, this._liveOthers);
      await this.refreshSkeletons();
      await this.refreshEditedFrames();
    },

    async undoEdit() {
      if (this.selectedTrackId === null) return;
      const bpIdx = this.selectedJoint === null ? null
                                                : jointToBodyPoseIndex(this.selectedJoint);
      const body = {
        track_id: this.selectedTrackId,
        frame: this.frame,
        joint_index: bpIdx,
      };
      const r = await fetch("/api/edit/undo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) return;
      const d = await r.json();
      if (!d.ok) { console.info("nothing to undo"); return; }
      this._liveJoints = d.joints;
      this._liveMesh = { verts: d.verts, faces: d.faces };
      updateThreePose(d.joints, d.verts, d.faces, this.selectedJoint, this._liveOthers);
      await this.refreshSkeletons();
      await this.refreshEditedFrames();
    },

    async refreshEditedFrames() {
      const r = await fetch("/api/edits");
      if (!r.ok) return;
      const d = await r.json();
      this.editedFrames = d.edits || {};
    },

    async exportEdits() {
      // edits auto-persist server-side on every commit; this downloads the file.
      const r = await fetch("/api/edits/download");
      if (!r.ok) {
        if (r.status === 404) alert("No edits saved yet for this clip.");
        return;
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (this.activeClipId || "clip") + "_edits.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    },

    isFrameEdited(fIdx) {
      if (this.selectedTrackId === null) return false;
      const arr = this.editedFrames[String(this.selectedTrackId)] || [];
      return arr.includes(fIdx);
    },

    async prevFrame() { if (this.frame > 0) await this.loadFrame(this.frame - 1); },
    async nextFrame() { if (this.frame + 1 < this.nFrames) await this.loadFrame(this.frame + 1); },
    async jumpToFrame(n) {
      n = Math.max(0, Math.min(this.nFrames - 1, n));
      await this.loadFrame(n);
    },

    toggleShowAll() {
      this.showAll = !this.showAll;
      this.refreshThree();
    },

    // ── 2D frame fit / zoom / pan ──────────────────────────────────────────
    fitLayer() {
      const box = this.$refs.canvasFrame;
      if (!box) return;
      const cw = box.clientWidth, ch = box.clientHeight;
      const ar = (this.srcW || 16) / (this.srcH || 9);
      let w = cw, h = cw / ar;
      if (h > ch) { h = ch; w = ch * ar; }
      this.imgSize = { w, h };
      if (!this._viewInit) { this.resetView(); this._viewInit = true; }
    },

    resetView() {
      const box = this.$refs.canvasFrame;
      const cw = box ? box.clientWidth : this.imgSize.w;
      const ch = box ? box.clientHeight : this.imgSize.h;
      this.view = {
        scale: 1,
        tx: (cw - this.imgSize.w) / 2,
        ty: (ch - this.imgSize.h) / 2,
      };
    },

    _clampScale(s) { return Math.max(0.5, Math.min(8, s)); },

    _zoomAt(cx, cy, f) {
      const ns = this._clampScale(this.view.scale * f);
      const k = ns / this.view.scale;
      this.view = {
        scale: ns,
        tx: cx - (cx - this.view.tx) * k,
        ty: cy - (cy - this.view.ty) * k,
      };
    },

    zoomBy(f) {
      const box = this.$refs.canvasFrame;
      if (!box) return;
      this._zoomAt(box.clientWidth / 2, box.clientHeight / 2, f);
    },

    onWheel(e) {
      const box = this.$refs.canvasFrame;
      if (!box) return;
      const rect = box.getBoundingClientRect();
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      this._zoomAt(e.clientX - rect.left, e.clientY - rect.top, f);
    },

    onPanStart(e) {
      if (e.button !== 0) return;
      if (e.target.closest && e.target.closest(".zoom-hud")) return;
      this._panning = true;
      this._panLast = { x: e.clientX, y: e.clientY };
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    },

    onPanMove(e) {
      if (!this._panning) return;
      const dx = e.clientX - this._panLast.x;
      const dy = e.clientY - this._panLast.y;
      this._panLast = { x: e.clientX, y: e.clientY };
      this.view = { scale: this.view.scale, tx: this.view.tx + dx, ty: this.view.ty + dy };
    },

    onPanEnd() { this._panning = false; },
}));
Alpine.start();
</script>
</body>
</html>
